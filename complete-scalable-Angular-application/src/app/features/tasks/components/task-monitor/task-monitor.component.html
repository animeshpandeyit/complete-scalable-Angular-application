<div class="monitor-container">

    <h2>TaskFlow Live Monitor</h2>

    <div class="monitor-card">
        <h3>Live Counter</h3>
        <p>{{ counter }} seconds</p>
    </div>

    <div class="monitor-card">
        <h3>Task Refresh Count</h3>
        <p>{{ refreshCount }}</p>
    </div>

    <div class="notification">
        {{ notification || 'Waiting for notification...' }}
    </div>

</div>
