<div class="task-container">
  <h1>TaskFlow Management</h1>

  <h2>My Tasks</h2>

  <div *ngFor="let task of tasks" class="task-card">
    <h3>{{ task.title }}</h3>

    <p>Task ID: {{ task.id }}</p>

    <p>Status: {{ task.status }}</p>

    <p>Priority: {{ task.priority }}</p>
  </div>
</div>

<div class="task-container">
  <h1>TaskFlow – Live Monitor</h1>

  <div class="monitor-card">
    <h2>Live Counter</h2>

    <h1>{{ counter }}</h1>

    <p>Counter updates every second.</p>
  </div>

  <div class="notification-card">
    <h2>Task Notification</h2>

    <p *ngIf="notification; else waiting">
      {{ notification }}
    </p>

    <ng-template #waiting> Waiting for notification... </ng-template>
  </div>
</div>
